plugins {
    id 'net.neoforged.moddev' version '2.0.147'
    id 'maven-publish'
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_base_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

repositories {    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.neoforged:neoforge:${neoforge_version}"
    compileOnly "maven.modrinth:AANobbMI:${sodium_maven_version}"
    compileOnly "maven.modrinth:YL57xq9U:${iris_maven_version}"
    runtimeOnly "maven.modrinth:AANobbMI:${sodium_maven_version}"
    runtimeOnly "maven.modrinth:YL57xq9U:${iris_maven_version}"

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

neoForge {
    version = project.neoforge_version
    validateAccessTransformers = true

    runs {
        client {
            client()
            sourceSet sourceSets.client
            vmArg "-Djava.library.path=${projectDir}/src/main/resources"
            vmArg "--enable-native-access=ALL-UNNAMED"
            vmArg "-Xmx8g"
            vmArg "-Xms2g"
            vmArg "-XX:+AlwaysPreTouch"
        }
    }

    mods {
        complemetal {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    test {
        compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
    }
    gametest {
        compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named("compileTestJava") {
    dependsOn tasks.named("compileClientJava")
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

processResources {
    inputs.property "version", project.version
    exclude "libmetalrender_debug_v2.dylib"

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
            "Implementation-Title": "Complemetal",
            "Implementation-Version": project.version
        )
    }
    from("LICENSE")
    from("NOTICE")
    from('src/main/resources/native') {
        include 'metalrender.h', 'metalrender.mm'
        into 'native'
    }
}

tasks.register("buildNative", Exec) {
    group = "build"
    description = "Builds the macOS native library for development without recompiling Metal shaders."

    inputs.file("compile_native.sh")
    inputs.files(fileTree("src/main/resources/native") {
        include "*.h"
        include "*.mm"
    })
    inputs.property(
        "nativeSanitizer",
        providers.environmentVariable("METALRENDER_NATIVE_SANITIZER")
            .orElse("")
    )
    outputs.file(layout.buildDirectory.file("native/libmetalrender.dylib"))
    outputs.file("src/main/resources/libmetalrender.dylib")

    environment "BUILD_SHADERS", "0"
    workingDir projectDir
    commandLine "bash", file("compile_native.sh").absolutePath
}

def buildReleaseNativePayload =
    tasks.register("buildReleaseNativePayload", Exec) {
        group = "build"
        description = "Rebuilds the native library and every offline Metal shader for a release."

        inputs.file("compile_native.sh")
        inputs.files(fileTree("src/main/resources/native") {
            include "*.h"
            include "*.mm"
            include "shaders/*.metal"
        })
        outputs.file(layout.buildDirectory.file(
            "native/libmetalrender.dylib"))
        outputs.file("src/main/resources/libmetalrender.dylib")
        outputs.file("src/main/resources/shaders.metallib")
        outputs.upToDateWhen { false }

        environment "BUILD_NATIVE", "1"
        environment "BUILD_SHADERS", "1"
        // A publishable payload must never inherit a developer's sanitizer
        // environment and accidentally package an ASan runtime dependency.
        environment "METALRENDER_NATIVE_SANITIZER", ""
        workingDir projectDir
        commandLine "bash", file("compile_native.sh").absolutePath
    }

tasks.named("processResources") {
    mustRunAfter "buildNative"
    mustRunAfter buildReleaseNativePayload
}

tasks.named("sourcesJar") {
    mustRunAfter "buildNative"
    mustRunAfter buildReleaseNativePayload
}

def checkJniParity = tasks.register("checkJniParity", Exec) {
    group = "verification"
    description = "Verifies that NativeBridge declarations and Objective-C++ JNI exports match."

    inputs.file("scripts/check_jni_parity.sh")
    inputs.file("src/client/java/com/pebbles_boon/metalrender/nativebridge/NativeBridge.java")
    inputs.files(fileTree("src/main/resources/native") {
        include "*.mm"
    })
    outputs.upToDateWhen { false }

    commandLine "bash", file("scripts/check_jni_parity.sh").absolutePath
}

def testExactJarQaValidators = tasks.register("testExactJarQaValidators", Exec) {
    group = "verification"
    description = "Runs unit tests for exact-JAR evidence validators."

    inputs.file("scripts/exact_jar_qa.py")
    inputs.file("scripts/test_exact_jar_qa.py")

    commandLine "python3", "-m", "unittest",
        "discover", "-s", "scripts", "-p", "test_exact_jar_qa.py"
}

def releaseJar = tasks.named("jar")

def verifyReleaseJar = tasks.register("verifyReleaseJar", Exec) {
    group = "verification"
    description = "Verifies required metadata and native payload in the release JAR."
    dependsOn buildReleaseNativePayload
    dependsOn releaseJar

    inputs.file("scripts/verify_release_jar.sh")
    inputs.file(releaseJar.flatMap { it.archiveFile })
    outputs.upToDateWhen { false }

    doFirst {
        commandLine "bash",
            file("scripts/verify_release_jar.sh").absolutePath,
            releaseJar.get().archiveFile.get().asFile.absolutePath
    }
}

tasks.named("check") {
    dependsOn checkJniParity
    dependsOn testExactJarQaValidators
}

tasks.register("releaseCheck") {
    group = "verification"
    description = "Runs normal checks and verifies the complete publishable macOS JAR."
    dependsOn tasks.named("check")
    dependsOn verifyReleaseJar
}
