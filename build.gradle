// 1.21.1 port: native Metal/Iris compile gates run on macOS arm64 CI.
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_base_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"
    // Minecraft 1.21.1 ships LWJGL 3.3.3. Keep the optional in-process
    // shader translation bindings on the same ABI as the game.
    compileOnly "org.lwjgl:lwjgl-shaderc:3.3.3"
    compileOnly "org.lwjgl:lwjgl-spvc:3.3.3"
    localRuntime "org.lwjgl:lwjgl-shaderc:3.3.3"
    localRuntime "org.lwjgl:lwjgl-spvc:3.3.3"
    localRuntime "org.lwjgl:lwjgl-shaderc:3.3.3:natives-macos-arm64"
    localRuntime "org.lwjgl:lwjgl-spvc:3.3.3:natives-macos-arm64"
    compileOnly "maven.modrinth:sodium:${sodium_version}"
    compileOnly "maven.modrinth:iris:${iris_version}"
    localRuntime "maven.modrinth:sodium:${sodium_version}"
    localRuntime "maven.modrinth:iris:${iris_version}"

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

sourceSets.main.java.srcDir("src/client/java")

neoForge {
    version = project.neoforge_version
    validateAccessTransformers = true

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'complemetal'
            jvmArgument "-Djava.library.path=" + projectDir + "/src/main/resources"
            jvmArgument "--enable-native-access=ALL-UNNAMED"
            if (project.hasProperty('irisCapture')) {
                jvmArgument "-Dmetalrender.experimental.irisMetalPipeline=true"
                jvmArgument "-Dmetalrender.experimental.irisMetalTranslation=true"
            }
            if (project.hasProperty('irisGraph') || project.hasProperty('irisGraphOwnership')) {
                jvmArgument "-Dmetalrender.experimental.irisMetalPipeline=true"
                jvmArgument "-Dmetalrender.experimental.irisMetalTranslation=true"
                jvmArgument "-Dmetalrender.experimental.irisMetalLibraryValidation=true"
                jvmArgument "-Dmetalrender.experimental.irisMetalPipelineCompilation=true"
                jvmArgument "-Dmetalrender.experimental.irisMetalShadowReplay=true"
                jvmArgument "-Dmetalrender.experimental.irisMetalVisualParity=true"
                jvmArgument "-Dmetalrender.experimental.irisMetalFinalCutover=false"
                jvmArgument "-Dmetalrender.experimental.irisMetalGraphResources=true"
                jvmArgument "-Dmetalrender.experimental.irisMetalGraphExecution=true"
                jvmArgument "-Dmetalrender.experimental.irisMetalGraphOwnership=false"
            }
            if (project.hasProperty('irisGraphOwnership')) {
                jvmArgument "-Dmetalrender.experimental.irisMetalGraphOwnership=true"
            }
            jvmArgument "-Xmx8g"
            jvmArgument "-Xms2g"
            jvmArgument "-XX:+AlwaysPreTouch"
        }
    }

    mods {
        complemetal {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

processResources {
    inputs.property "version", project.version
    exclude "libmetalrender_debug_v2.dylib"

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
            "Implementation-Title": "Complemetal",
            "Implementation-Version": project.version
        )
    }
    from("LICENSE")
    from("NOTICE")
    from('src/main/resources/native') {
        include 'metalrender.h', 'metalrender.mm'
        into 'native'
    }
}

tasks.register("buildNative", Exec) {
    group = "build"
    description = "Builds the macOS native library for development without recompiling Metal shaders."

    inputs.file("compile_native.sh")
    inputs.files(fileTree("src/main/resources/native") {
        include "*.h"
        include "*.mm"
    })
    inputs.property(
        "nativeSanitizer",
        providers.environmentVariable("METALRENDER_NATIVE_SANITIZER")
            .orElse("")
    )
    outputs.file(layout.buildDirectory.file("native/libmetalrender.dylib"))
    outputs.file("src/main/resources/libmetalrender.dylib")

    environment "BUILD_SHADERS", "0"
    workingDir projectDir
    commandLine "bash", file("compile_native.sh").absolutePath
}

def buildReleaseNativePayload =
    tasks.register("buildReleaseNativePayload", Exec) {
        group = "build"
        description = "Rebuilds the native library and every offline Metal shader for a release."

        inputs.file("compile_native.sh")
        inputs.files(fileTree("src/main/resources/native") {
            include "*.h"
            include "*.mm"
            include "shaders/*.metal"
        })
        outputs.file(layout.buildDirectory.file(
            "native/libmetalrender.dylib"))
        outputs.file("src/main/resources/libmetalrender.dylib")
        outputs.file("src/main/resources/shaders.metallib")
        outputs.upToDateWhen { false }

        environment "BUILD_NATIVE", "1"
        environment "BUILD_SHADERS", "1"
        // A publishable payload must never inherit a developer's sanitizer
        // environment and accidentally package an ASan runtime dependency.
        environment "METALRENDER_NATIVE_SANITIZER", ""
        workingDir projectDir
        commandLine "bash", file("compile_native.sh").absolutePath
    }

tasks.named("processResources") {
    mustRunAfter "buildNative"
    mustRunAfter buildReleaseNativePayload
}

tasks.named("sourcesJar") {
    mustRunAfter "buildNative"
    mustRunAfter buildReleaseNativePayload
}

def checkJniParity = tasks.register("checkJniParity", Exec) {
    group = "verification"
    description = "Verifies that NativeBridge declarations and Objective-C++ JNI exports match."

    inputs.file("scripts/check_jni_parity.sh")
    inputs.file("src/client/java/com/pebbles_boon/metalrender/nativebridge/NativeBridge.java")
    inputs.files(fileTree("src/main/resources/native") {
        include "*.mm"
    })
    outputs.upToDateWhen { false }

    commandLine "bash", file("scripts/check_jni_parity.sh").absolutePath
}

def testExactJarQaValidators = tasks.register("testExactJarQaValidators", Exec) {
    group = "verification"
    description = "Runs unit tests for exact-JAR evidence validators."

    inputs.file("scripts/exact_jar_qa.py")
    inputs.file("scripts/test_exact_jar_qa.py")

    commandLine "python3", "-m", "unittest",
        "discover", "-s", "scripts", "-p", "test_exact_jar_qa.py"
}

def releaseJar = tasks.named("jar")

def verifyReleaseJar = tasks.register("verifyReleaseJar", Exec) {
    group = "verification"
    description = "Verifies required metadata and native payload in the release JAR."
    dependsOn buildReleaseNativePayload
    dependsOn releaseJar

    inputs.file("scripts/verify_release_jar.sh")
    inputs.file(releaseJar.flatMap { it.archiveFile })
    outputs.upToDateWhen { false }

    doFirst {
        commandLine "bash",
            file("scripts/verify_release_jar.sh").absolutePath,
            releaseJar.get().archiveFile.get().asFile.absolutePath
    }
}

tasks.named("check") {
    dependsOn checkJniParity
    dependsOn testExactJarQaValidators
}

tasks.register("releaseCheck") {
    group = "verification"
    description = "Runs normal checks and verifies the complete publishable macOS JAR."
    dependsOn tasks.named("check")
    dependsOn verifyReleaseJar
}
