name: verify

on:
  push:
    branches:
      - neoforge-1.21.1-port
  pull_request:
    branches:
      - neoforge-1.21.1-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-check:
    name: Java check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run Gradle checks
        run: ./gradlew --no-daemon check

  native-macos:
    name: macOS native compile
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build native library
        run: ./gradlew --no-daemon buildNative
