name: build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: complemetal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure the offline Metal compiler is installed
        run: |
          if ! xcrun --sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx metal --version
          xcrun --sdk macosx --find metallib

      - name: Check NeoForge 1.21.1 port hygiene
        run: bash ./scripts/check_neoforge_port_hygiene.sh

      - name: Compile, test, package, and verify
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          METALRENDER_IRIS_TRANSLATION_SMOKE: "1"
        run: ./gradlew --no-daemon clean test check build releaseCheck

      - name: Smoke-test packaged native payload
        run: |
          java -version
          javac -version
          javac_version="$(javac -version 2>&1 | awk '{print $2}' | cut -d. -f1)"
          if [[ "$javac_version" != "21" ]]; then
            echo "Smoke test requires javac 21, found $javac_version" >&2
            exit 1
          fi
          ./scripts/smoke_release_payload.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: complemetal-mc1.21.1-neoforge
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
